<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0e1217">
  <title>Поделиться в Discord | The Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0e1217);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #161b22);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #8b949e);
      --accent-color: var(--tg-theme-button-color, #5865f2);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.09);
      --card-active: rgba(88, 101, 242, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; padding: 16px 14px 24px; overflow-x: hidden; }
    header { text-align: center; margin-bottom: 12px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; background: rgba(88, 101, 242, 0.15); border: 1px solid rgba(88, 101, 242, 0.3); color: #7289da; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 8px; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background-color: #5865f2; box-shadow: 0 0 8px #5865f2; }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    p.subtitle { font-size: 13px; color: var(--hint-color); }

    /* Строка ввода ссылки */
    .link-container {
      margin-bottom: 12px;
      background: var(--card-bg);
      border: 1px solid rgba(88, 101, 242, 0.4);
      border-radius: 14px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 46px;
      transition: all 0.2s ease;
    }

    .link-container:focus-within {
      border-color: #5865f2;
      box-shadow: 0 0 12px rgba(88, 101, 242, 0.35);
      background: rgba(255, 255, 255, 0.08);
    }

    .link-icon {
      font-size: 18px;
      line-height: 1;
      opacity: 0.9;
    }

    .link-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
    }

    .link-input::placeholder {
      color: var(--hint-color);
      font-size: 13px;
    }

    /* Переключатели опций (Спойлер / Анонимно) */
    .options-container {
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 2px 14px;
    }

    .toggle-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      cursor: pointer;
      user-select: none;
    }

    .toggle-option:not(:last-child) {
      border-bottom: 1px solid var(--card-border);
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-icon {
      font-size: 18px;
      line-height: 1;
    }

    .toggle-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-color);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.12);
      transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 26px;
      border: 1px solid var(--card-border);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    .switch input:checked + .slider {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .switch input:checked + .slider:before {
      transform: translateX(18px);
    }

    /* Сетка категорий */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; flex: 1; }
    
    .category-btn { position: relative; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px 12px; color: var(--text-color); cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; min-height: 80px; transition: all 0.12s ease; overflow: hidden; outline: none; }
    .category-btn::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent); opacity: 0; transition: opacity 0.2s ease; }
    .category-btn:hover { background: var(--card-hover); border-color: rgba(255, 255, 255, 0.15); }
    .category-btn:hover::before { opacity: 1; }
    .category-btn:active { transform: scale(0.96); background: var(--card-active); border-color: #5865f2; }
    
    .icon-wrapper { font-size: 26px; margin-bottom: 6px; line-height: 1; }
    .category-name { font-size: 14px; font-weight: 600; line-height: 1.25; color: #f0f3f6; }
    .category-desc { font-size: 11px; color: var(--hint-color); margin-top: 2px; line-height: 1.2; }
    
    .btn-nsfw { border-color: rgba(237, 66, 69, 0.2); background: rgba(237, 66, 69, 0.05); }
    .btn-nsfw:hover { border-color: rgba(237, 66, 69, 0.4); background: rgba(237, 66, 69, 0.1); }
    .btn-nsfw:active { background: rgba(237, 66, 69, 0.25); border-color: #ed4245; }
    .btn-nsfw .category-desc { color: #e06c75; }
  </style>
</head>
<body>
  <header>
    <div class="badge"><span class="badge-dot"></span>The Hub Bridge</div>
    <h1>Выберите категорию</h1>
    <p class="subtitle">Куда отправить медиа на сервере Discord?</p>
  </header>

  <!-- Строка ввода ссылки (X, Pinterest, Shorts, TikTok) -->
  <div class="link-container">
    <span class="link-icon">🔗</span>
    <input 
      type="url" 
      id="link-input" 
      class="link-input" 
      placeholder="Вставьте ссылку (X, Pinterest, Shorts, TikTok)..." 
      autocomplete="off" 
      autocapitalize="none"
      spellcheck="false"
    />
  </div>

  <!-- Блок тумблеров опций -->
  <div class="options-container">
    <label class="toggle-option" for="opt-blur">
      <div class="toggle-label">
        <span class="toggle-icon">👁️</span>
        <span class="toggle-text">Скрыть под спойлер</span>
      </div>
      <div class="switch">
        <input type="checkbox" id="opt-blur">
        <span class="slider"></span>
      </div>
    </label>

    <label class="toggle-option" for="opt-anon">
      <div class="toggle-label">
        <span class="toggle-icon">🕵️</span>
        <span class="toggle-text">Анонимно</span>
      </div>
      <div class="switch">
        <input type="checkbox" id="opt-anon">
        <span class="slider"></span>
      </div>
    </label>
  </div>

  <main class="grid">
    <button class="category-btn" onclick="sendCategory('selfie')">
      <div class="icon-wrapper">📸</div>
      <div><div class="category-name">Сэлфи</div><div class="category-desc">├・🔥・сэлфи</div></div>
    </button>
    <button class="category-btn" onclick="sendCategory('meme')">
      <div class="icon-wrapper">🎭</div>
      <div><div class="category-name">Мем</div><div class="category-desc">╭・💿・меморий</div></div>
    </button>
    <button class="category-btn" onclick="sendCategory('pics')">
      <div class="icon-wrapper">🖼️</div>
      <div><div class="category-name">Картинки</div><div class="category-desc">├・👹・скрины</div></div>
    </button>
    <button class="category-btn" onclick="sendCategory('photo')">
      <div class="icon-wrapper">📷</div>
      <div><div class="category-name">Ваши фото</div><div class="category-desc">├・🌄・фотографии</div></div>
    </button>
    <button class="category-btn" onclick="sendCategory('other')">
      <div class="icon-wrapper">💬</div>
      <div><div class="category-name">Другое</div><div class="category-desc">Главный чат Хаба</div></div>
    </button>
    <button class="category-btn" onclick="sendCategory('art')">
      <div class="icon-wrapper">🎨</div>
      <div><div class="category-name">Личное творчество</div><div class="category-desc">├・🖌️・творчество</div></div>
    </button>
    <button class="category-btn btn-nsfw" onclick="sendCategory('nsfwm')">
      <div class="icon-wrapper">🙎‍♂️</div>
      <div><div class="category-name">Парни (18+)</div><div class="category-desc">18+ контент</div></div>
    </button>
    <button class="category-btn btn-nsfw" onclick="sendCategory('nsfwf')">
      <div class="icon-wrapper">🙍‍♀️</div>
      <div><div class="category-name">Девушки (18+)</div><div class="category-desc">18+ контент</div></div>
    </button>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0e1217');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#0e1217');
    }

    function sendCategory(safeCategoryName) {
      if (tg && tg.HapticFeedback) {
        try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
      }

      const isBlur = document.getElementById('opt-blur')?.checked ? '1' : '0';
      const isAnon = document.getElementById('opt-anon')?.checked ? '1' : '0';
      const linkInput = document.getElementById('link-input');
      const linkVal = linkInput ? linkInput.value.trim() : '';

      let payload = 'cat_' + safeCategoryName + '_' + isBlur + '_' + isAnon;
      let sendDataPayload = payload;

      if (linkVal) {
        sendDataPayload = payload + '|' + linkVal;
        try {
          const cleanLink = linkVal.replace(/^https?:\/\//i, '');
          const b64 = btoa(encodeURIComponent(cleanLink).replace(/%([0-9A-F]{2})/g, function(match, p1) {
            return String.fromCharCode('0x' + p1);
          })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          if (b64 && (payload.length + 1 + b64.length) <= 64) {
            payload = payload + '_' + b64;
          }
        } catch (e) {}
      }

      try {
        if (tg && typeof tg.sendData === 'function') {
          tg.sendData(sendDataPayload);
        }
      } catch (e) {}

      const botUsername = 'Thehub69_bot';
      const deepLink = 'https://t.me/' + botUsername + '?start=' + payload;

      try {
        if (tg && typeof tg.openTelegramLink === 'function') {
          tg.openTelegramLink(deepLink);
        } else {
          window.location.href = deepLink;
        }
      } catch (e) {
        window.location.href = deepLink;
      }

      setTimeout(() => {
        try { if (tg && typeof tg.close === 'function') tg.close(); } catch (e) {}
      }, 150);
    }
  </script>
</body>
</html>
